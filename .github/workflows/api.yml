# MOVE THIS FILE to the repository root: .github/workflows/api.yml
# GitHub Actions only runs workflows located at the repo-root .github/workflows/.
name: api

on:
  push:
    paths: ["api/**"]
  pull_request:
    paths: ["api/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: npm install
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # The committed openapi.json is what admin/ and mobile/ generate their
      # types from. If a route or a DTO changes and this is not regenerated,
      # both clients go back to describing an API that no longer exists — the
      # exact failure the generator was added to stop. Fails the job, it does
      # not regenerate: a CI job that rewrites committed artefacts hides the
      # change from review.
      - name: OpenAPI document is current
        run: npm run openapi:check
