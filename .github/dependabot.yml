version: 2
updates:
  # Root web app dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "next"
        update-types: ["major"]
      - dependency-name: "react"
        update-types: ["major"]
      - dependency-name: "react-dom"
        update-types: ["major"]

  # API dependencies
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      api-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Admin console dependencies
  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      admin-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "next"
        update-types: ["major"]
      - dependency-name: "react"
        update-types: ["major"]
      - dependency-name: "react-dom"
        update-types: ["major"]
