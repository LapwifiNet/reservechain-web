# Decision log — spec ↔ guardrail conflicts (Screen Registry §2, mirrored).
# status: open | closed. When a decision is closed, conflict screens blocking
# on it must be updated (verify-screens check 3 fails otherwise).

- id: D1
  title: Per-unit passport (SC-WEB-LOT)
  status: closed
  decision: >-
    Per-unit pages are allowed only when their content comes from a published
    CMS asset-record (the asset-records collection — staff-read today, no
    publish flag yet); a route with no published record must 404, and fixtures
    stay banned. Invariant #30 is amended from "no per-unit" to "no fixtures":
    the retired /passport/:id route stays retired with its redirect, and
    SC-WEB-LOT stays missing until real lot data exists — it is reintroduced
    CMS-backed only when the owner supplies records. Closed 2026-08-03

- id: D2
  title: Asset figures (IGAS CoA on Copper/Nickel pages)
  status: closed
  decision: >-
    No real CoA scans exist, so option (b): the Copper/Nickel pages keep every
    evidence column Pending and the invented figures are scrubbed — purity
    percentages, "IGAS 0004512", "0.025mm" and the purity-based page titles —
    from the pages, the messages (en/es/it) and the Wireframe Spec. Figures may
    be shown again only when the owner supplies a real Certificate of Analysis;
    it is then entered in the CMS (asset-records.certificate upload +
    certificateRef) and rendered from CMS, never hardcoded. Reference purity
    values in the CMS asset-programs seed (99.9999% / 99.9807%) remain as
    program-level reference data feeding the program grid (PR #23, reviewed) —
    they are nominal program specs, not CoA claims about a specific lot.
    Closed 2026-08-03

- id: D3
  title: Inactive module placeholders
  status: closed
  decision: Placeholder UI in the frontend while the backend keeps the 501 contract — the two rules address different layers and do not conflict. The placeholder names the module, states it is not active, and gives the reason (pending legal, audit, pen-test and written authorisation). It must be rendered statically from the feature flag at build/render time and must NEVER be derived by calling the endpoint and catching a 501, otherwise a change of error code silently changes what the UI claims. Kill-switch flags and invariant #31 are unchanged. Closed 2026-08-02

- id: D4
  title: Website modes
  status: closed
  decision: Mode is CMS data (Payload settings collection, SC-CMS-SETTINGS) with SITE_MODE env fallback; the 4 kill-switch flags stay env-only and keep answering 501. Implemented 2026-08-02 (cms/src/collections/Settings.ts, src/lib/mode.ts siteModeFromCms)

- id: D5
  title: Status chips (publication / token / asset)
  status: closed
  decision: State is CMS data (settings.publicationStatus / tokenStatus / assetStatus), wording is not — the CMS stores an enum and the website renders an approved translated string per state, so no admin edit can write chip copy. Scales are ordered and beforeChange refuses a jump; the token scale stops at testnet-deployed and cannot express an offer (guardrails 1, 6). CMS unreachable falls back to the first state on each scale, not the last known one. Implemented 2026-08-02 (cms/src/lib/statusMachine.ts, src/lib/status.ts, src/components/StatusChips.tsx, migration 20260801_210311)

- id: D6
  title: Screen count
  status: closed
  decision: 84 screen IDs; 8 legal pages share one artboard. Reopened and re-closed 2026-08-02 — the original 84 was counted as 80 because four live routes (/portal, /portal/register, /passports, /registry) were claimed by no screen id and check 1 of verify-screens never ran to say so. Added SC-WEB-DAPLIST, SC-WEB-REGISTRY, SC-INV-REG, SC-INV-STATUS
